[package]
name = "zazijvr-email"
version = "1.5.5"
description = "Zazij VR Email Client"
authors = ["Sefin"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.0.0"
tauri-plugin-store = "2.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-notification = "2"
open = "5.3.3"
tauri-plugin-http = "2.5.8"
# Jiné e-mailové účty (Seznam, vlastní doména…): IMAP čtení, SMTP odesílání, rozbor zpráv – i na Androidu.
# TLS přes rustls (bez OpenSSL – jde přeložit pro Android), kořenové certifikáty z webpki-roots.
imap = { version = "2.4", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
mail-parser = "0.9"
utf7-imap = "0.3"
base64 = "0.22"
[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Refresh tokeny Google účtů v systémové klíčence (KWallet / GNOME Keyring, Windows Credential Manager, macOS Keychain)
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"

# Android: kontrola pošty na pozadí volaná z Kotlinu (MailNative.checkMail)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Upozornění na novou poštu s reakcí na kliknutí (D-Bus; plugin pro upozornění kliknutí na Linuxu nepředává)
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
