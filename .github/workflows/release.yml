name: Měsíční kompilace do Cloudu

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Instalace Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Příprava Rust Compileru
        uses: dtolnay/rust-toolchain@stable

      - name: Instalace Linuxových knihoven (C/GTK/Webkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Generování Tajného .env souboru
        run: |
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" > .env
          echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Stažení NPM balíčků
        run: npm install

      - name: Sestavení produkční verze uzevřené aplikace
        run: |
          npx tauri build --bundles deb
          mv src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/deb/zazijvr-email-latest.deb

      - name: Publikace zkompilované verze do Release složky
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-build
          name: "Poslední sestavení z Cloudu (ZazijVR Email)"
          body: "Tento instalační balíček byl plně automaticky zkompilován robotem. Obsahuje všechna hesla."
          files: src-tauri/target/release/bundle/deb/zazijvr-email-latest.deb
          prerelease: false

  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Instalace Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Příprava Rust Compileru
        uses: dtolnay/rust-toolchain@stable

      - name: Generování Tajného .env souboru
        shell: bash
        run: |
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" > .env
          echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Stažení NPM balíčků
        run: npm install

      - name: Sestavení produkční verze uzevřené aplikace
        shell: bash
        run: |
          npx tauri build --bundles nsis
          mv src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/zazijvr-email-latest.exe

      - name: Publikace zkompilované verze do Release složky
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-build
          files: src-tauri/target/release/bundle/nsis/zazijvr-email-latest.exe
          prerelease: false
