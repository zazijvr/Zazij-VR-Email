name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          npm install
      - name: Build APK
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
        run: |
          echo "VITE_GOOGLE_CLIENT_ID_DESKTOP=${VITE_GOOGLE_CLIENT_ID}" > .env
          echo "VITE_GOOGLE_CLIENT_ID_MOBILE=998474655983-jq4t5k74j14rav8jhehlrmj7qa0fr07v.apps.googleusercontent.com" >> .env
          echo "VITE_GOOGLE_CLIENT_SECRET=${VITE_GOOGLE_CLIENT_SECRET}" >> .env
          npx tauri android init || true
          npx tauri icon "public/applogo_android .png"
          npx tauri android build --apk
      - name: Sign Release APK
        run: |
          # Vygenerovani testovaciho klice uvnitr kontejneru pro podepsani aplikace
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -dname "CN=ZažijVR" -storepass android -keypass android
          
          # Nalezeni nejnovejsi verze Android build-tools
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          # Zipalign unsigned balicku
          $BUILD_TOOLS/zipalign -v 4 src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk aligned.apk
          
          # Podepsani APK klicem, cimz vznika instlovatelne Release APK
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-key-alias my-alias --ks-pass pass:android --key-pass pass:android --out app-universal-release-signed.apk aligned.apk
      - name: Publikace zkompilované verze do Release složky
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest-build
          files: app-universal-release-signed.apk
          prerelease: false
