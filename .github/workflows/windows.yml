name: Windows instalátor

# Spouští scripts/release.sh windows X.Y.Z (nebo ručně tlačítkem na GitHubu).
# Sestaví jen instalátor (NSIS .exe). Podpis pro automatické aktualizace se dělá lokálně
# podpisovým klíčem, který na GitHubu není.

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mezipaměť Rustu
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Konfigurace (.env)
        shell: bash
        run: |
          echo "VITE_GOOGLE_CLIENT_ID_DESKTOP=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" > .env
          echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Závislosti
        run: npm ci

      - name: Sestavení instalátoru
        shell: bash
        # Bez podpisu pro aktualizace (klíč je jen lokálně) – podepíše se po stažení
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Instalátor ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
