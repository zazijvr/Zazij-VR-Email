name: Linux AppImage

# Spouští scripts/release.sh (nebo ručně tlačítkem na GitHubu).
# Sestavuje se na obecném Ubuntu 22.04, ne lokálně: AppImage přibalí systémové knihovny
# (WebKitGTK, GTK…) a lokální CachyOS má knihovny pro Zen 4 (AVX-512) – takový AppImage
# na jiných procesorech spadl na SIGILL. Starší glibc z 22.04 zároveň běží na většině distribucí.
# Podpis pro automatické aktualizace se dělá lokálně podpisovým klíčem, který na GitHubu není.

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Systémové knihovny
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev libsoup-3.0-dev patchelf file

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mezipaměť Rustu
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Konfigurace (.env)
        run: |
          echo "VITE_GOOGLE_CLIENT_ID_DESKTOP=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" > .env
          echo "VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Závislosti
        run: npm ci

      - name: Sestavení AppImage
        # Bez podpisu pro aktualizace (klíč je jen lokálně) – podepíše se po stažení
        run: npx tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: AppImage ke stažení
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
