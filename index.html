<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon_vr.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZažijVR Email & Calendar</title>
    <style>
      /* Úvodní animace – je přímo v HTML, takže se ukáže hned po otevření okna, ještě než se
         načte aplikace. Animuje se jen opacity a transform (plynulé i ve WebKitGTK).
         Skrývá ji src/main.tsx (hideSplash), až je aplikace vykreslená. */
      html, body { margin: 0; background: #061026; }
      #splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background:
          radial-gradient(ellipse 55% 45% at 50% 42%, rgba(0, 243, 255, 0.10), transparent 70%),
          radial-gradient(ellipse 40% 35% at 62% 62%, rgba(217, 37, 123, 0.08), transparent 70%),
          #061026;
        transition: opacity 0.45s ease;
        overflow: hidden;
        user-select: none;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .stage { display: flex; flex-direction: column; align-items: center; transition: transform 0.45s ease; }
      #splash.out .stage { transform: scale(1.06); }

      #splash .hero { position: relative; width: 180px; height: 180px; }
      #splash .ring {
        position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; margin: -85px 0 0 -85px;
        border-radius: 50%; border: 2px solid rgba(0, 243, 255, 0.55);
        box-shadow: 0 0 18px rgba(0, 243, 255, 0.35), inset 0 0 18px rgba(0, 243, 255, 0.2);
        opacity: 0; animation: splashRing 1.6s cubic-bezier(0.2, 0.7, 0.3, 1) 0.25s both;
      }
      #splash .ring.r2 { border-color: rgba(217, 37, 123, 0.5); box-shadow: 0 0 18px rgba(217, 37, 123, 0.3); animation-delay: 0.55s; }
      #splash .mascot-in { position: absolute; inset: 0; animation: splashMascotIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) both; }
      #splash .mascot-float { position: absolute; inset: 0; animation: splashFloat 3.2s ease-in-out 0.75s infinite; }
      #splash .mascot-float img { width: 100%; height: 100%; display: block; }
      /* Odlesk přes hledí (hledí je v SVG na x 78–178, y 62–96 z 256) */
      #splash .visor {
        position: absolute; left: 30.5%; top: 24.2%; width: 39%; height: 13.3%;
        border-radius: 12px; overflow: hidden;
      }
      #splash .visor::after {
        content: ''; position: absolute; top: -20%; bottom: -20%; left: 0; width: 35%;
        background: linear-gradient(90deg, transparent, rgba(220, 255, 255, 0.85), transparent);
        transform: translateX(-150%) skewX(-20deg);
        animation: splashGlint 0.9s ease-in-out 0.8s both;
      }

      #splash .logo { margin-top: 22px; animation: splashUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both; }
      #splash .logo img { display: block; width: 210px; height: 70px; }
      #splash .line {
        margin-top: 14px; width: 220px; height: 2px; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #00f3ff 25%, #d9257b 75%, transparent);
        box-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        transform-origin: center; animation: splashLine 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
      }
      #splash .tag {
        margin-top: 12px; font: 600 11px/1 system-ui, sans-serif; letter-spacing: 0.45em;
        text-transform: uppercase; color: rgba(148, 163, 184, 0.9); padding-left: 0.45em;
        animation: splashFade 0.6s ease-out 0.95s both;
      }

      @keyframes splashMascotIn { from { opacity: 0; transform: translateY(18px) scale(0.82); } to { opacity: 1; transform: none; } }
      @keyframes splashFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes splashRing { 0% { opacity: 0; transform: scale(0.55); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.7); } }
      @keyframes splashGlint { to { transform: translateX(400%) skewX(-20deg); } }
      @keyframes splashUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes splashLine { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
      @keyframes splashFade { from { opacity: 0; } to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation: none !important; }
        #splash .ring { display: none; }
      }
    </style>
  </head>
  <body class="bg-[#0f172a] text-white">
    <div id="splash" aria-hidden="true">
      <div class="stage">
        <div class="hero">
          <div class="ring"></div>
          <div class="ring r2"></div>
          <div class="mascot-in">
            <div class="mascot-float">
              <img src="/vr_mascot.svg" alt="" draggable="false" />
              <div class="visor"></div>
            </div>
          </div>
        </div>
        <div class="logo"><img src="/cropped-logo-neon-pruhledna-150x50.png" alt="ZažijVR" draggable="false" /></div>
        <div class="line"></div>
        <div class="tag">E-mail · Kalendář</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
